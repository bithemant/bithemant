<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hemant Singh — Software Developer, AI/ML · Cybersecurity · Full-Stack</title>
  <desc id="desc">Dark engineering banner matching bit-hemant.me and the LinkedIn banner: ink-black background, glowing blue and orange circuit traces, huge cream type, animated accent line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171914"/><stop offset=".55" stop-color="#101210"/><stop offset="1" stop-color="#0e1a2e"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3149e8" stop-opacity="0"/><stop offset=".48" stop-color="#6b7cff"/><stop offset="1" stop-color="#ed633d" stop-opacity="0"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3149e8"/><stop offset="1" stop-color="#ed633d"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#6b7cff" stroke-opacity=".06" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1010" cy="60" r="230" fill="#3149e8" opacity=".09">
    <animate attributeName="opacity" values=".05;.14;.05" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M880 40 H1040 L1100 100 V180" stroke="#3149e8" stroke-opacity=".45" stroke-width="2"/>
    <path d="M880 90 H1000 L1060 150 V240" stroke="#ed633d" stroke-opacity=".5" stroke-width="2"/>
    <path d="M920 200 H1080 L1140 260" stroke="#3149e8" stroke-opacity=".3" stroke-width="2"/>
    <circle cx="880" cy="40" r="4" fill="#3149e8"/>
    <circle cx="1040" cy="40" r="4" fill="#ed633d"/>
    <circle cx="1100" cy="100" r="4" fill="#3149e8"/>
    <circle cx="1000" cy="90" r="4" fill="#ed633d"/>
    <circle cx="1060" cy="150" r="4" fill="#3149e8"/>
    <circle cx="920" cy="200" r="4" fill="#ed633d"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="56" y="48" width="4" height="242" rx="2" fill="url(#accent)"/>
    <text x="82" y="76" fill="#8fa0ff" font-size="14" font-weight="700" letter-spacing="4">SOFTWARE DEVELOPER  /  AI / ML  /  CYBERSECURITY</text>
    <text x="78" y="158" fill="#f2f0e9" font-size="72" font-weight="750" letter-spacing="-1.5">HEMANT SINGH</text>
    <text x="82" y="198" fill="#d1d5db" font-size="20">Software Developer — <tspan fill="#6b7cff" font-weight="700">AI / ML</tspan> · Cybersecurity · Full-Stack</text>
    <g transform="translate(82 226)">
      <rect width="196" height="34" rx="17" fill="none" stroke="#ed633d" stroke-opacity=".85"/>
      <text x="98" y="22" fill="#ff8a5c" text-anchor="middle" font-size="13" font-weight="700">OPEN TO INTERNSHIPS</text>
      <text x="216" y="22" fill="#6b7cff" font-size="20" font-weight="700">bit-hemant.me</text>
    </g>
    <path d="M80 310H1120" stroke="#6b7cff" stroke-opacity=".16"/>
    <path d="M80 310H1120" stroke="url(#line)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0 1040;320 1040;0 1040" dur="5s" repeatCount="indefinite"/>
    </path>
    <text x="82" y="337" fill="#9ca3af" font-size="11" letter-spacing="2">LEARN  ·  BUILD  ·  ITERATE</text>
    <text x="1118" y="337" fill="#9ca3af" font-size="11" text-anchor="end">MUMBAI, INDIA</text>
  </g>
</svg>
