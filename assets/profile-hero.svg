<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hemant Singh — Software Engineering and Applied AI/ML</title>
  <desc id="desc">Minimal charcoal and violet animated banner with moving accent lines and a terminal-inspired engineering motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset=".58" stop-color="#11101b"/><stop offset="1" stop-color="#1d1235"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".48" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#c4b5fd" stroke-opacity=".055" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1010" cy="60" r="230" fill="#7c3aed" opacity=".09">
    <animate attributeName="opacity" values=".05;.14;.05" dur="6s" repeatCount="indefinite"/>
  </circle>
  <path d="M770 0L1000 0L1200 200L1200 360L1080 360L770 50Z" fill="#8b5cf6" opacity=".035"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="56" y="48" width="4" height="242" rx="2" fill="url(#accent)"/>
    <text x="82" y="76" fill="#c4b5fd" font-size="14" font-weight="700" letter-spacing="4">SOFTWARE ENGINEERING  /  APPLIED AI/ML</text>
    <text x="78" y="151" fill="#f8fafc" font-size="58" font-weight="750" letter-spacing="-1.5">HEMANT SINGH</text>
    <text x="82" y="190" fill="#d1d5db" font-size="20">Building useful software. Exploring intelligent systems.</text>
    <g transform="translate(82 226)">
      <rect width="150" height="34" rx="17" fill="#7c3aed" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/>
      <text x="75" y="22" fill="#ddd6fe" text-anchor="middle" font-size="13">COMPUTER VISION</text>
      <rect x="162" width="94" height="34" rx="17" fill="#7c3aed" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/>
      <text x="209" y="22" fill="#ddd6fe" text-anchor="middle" font-size="13">AI / ML</text>
      <rect x="268" width="160" height="34" rx="17" fill="#7c3aed" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/>
      <text x="348" y="22" fill="#ddd6fe" text-anchor="middle" font-size="13">BACKEND SYSTEMS</text>
    </g>
    <g transform="translate(810 92)">
      <rect width="322" height="170" rx="14" fill="#0b0d12" fill-opacity=".72" stroke="#8b5cf6" stroke-opacity=".42"/>
      <path d="M0 38H322" stroke="#8b5cf6" stroke-opacity=".3"/>
      <circle cx="20" cy="19" r="4" fill="#f87171"/><circle cx="34" cy="19" r="4" fill="#fbbf24"/><circle cx="48" cy="19" r="4" fill="#4ade80"/>
      <text x="68" y="23" fill="#9ca3af" font-size="10">ENGINEERING.LOG</text>
      <text x="22" y="67" fill="#a78bfa" font-size="13">$ build --focus</text>
      <text x="22" y="91" fill="#e5e7eb" font-size="13">computer-vision</text>
      <text x="22" y="115" fill="#e5e7eb" font-size="13">applied-ai</text>
      <text x="22" y="139" fill="#e5e7eb" font-size="13">software-systems</text>
      <rect x="22" y="150" width="7" height="13" rx="1" fill="#c4b5fd" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <path d="M-20 190H342" stroke="url(#line)" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-dasharray" values="0 400;180 400;0 400" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M80 310H1120" stroke="#a78bfa" stroke-opacity=".16"/>
    <path d="M80 310H1120" stroke="url(#line)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0 1040;320 1040;0 1040" dur="5s" repeatCount="indefinite"/>
    </path>
    <text x="82" y="337" fill="#9ca3af" font-size="11" letter-spacing="2">LEARN  ·  BUILD  ·  ITERATE</text>
    <text x="1118" y="337" fill="#9ca3af" font-size="11" text-anchor="end">bit-hemant.me</text>
  </g>
</svg>